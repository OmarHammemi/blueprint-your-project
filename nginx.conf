# Nginx configuration for BlindeData SPA
# Place this in your nginx site configuration

server {
    listen 80;
    server_name blindedata.com www.blindedata.com;
    
    root /var/www/blindedata;  # Update this to your actual web root
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
